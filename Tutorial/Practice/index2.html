<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 1 - Variables & Data Types</title>
</head>
<body>
  <h1>JavaScript Exercise 1: Variables & Data Types</h1>
  <p>Open the browser console to see the output. (Right-click → Inspect → Console)</p>

  <script>
    // Number
    let p = 53;
    console.log("Value of p:", p);
    console.log("Type of p:", typeof p);

    // String
    let name = "Alice";
    console.log("Value of name:", name);
    console.log("Type of name:", typeof name);

    // Boolean
    let isStudent = true;
    console.log("Value of isStudent:", isStudent);
    console.log("Type of isStudent:", typeof isStudent);

    // Undefined
    let x;
    console.log("Value of x:", x);
    console.log("Type of x:", typeof x);

    // Null
    let y = null;
    console.log("Value of y:", y);
    console.log("Type of y:", typeof y); // typeof null -> "object"

    // Object
    let person = { firstName: "John", lastName: "Doe" };
    console.log("Value of person:", person);
    console.log("Type of person:", typeof person);

    // Array
    let numbers = [1, 2, 3, 4, 5];
    console.log("Value of numbers:", numbers);
    console.log("Type of numbers:", typeof numbers);

    // Function
    function greet() {
      return "Hello!";
    }
    console.log("Value of greet:", greet);
    console.log("Type of greet:", typeof greet);
  </script>
</body>
</html>
